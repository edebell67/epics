# VERSION HISTORY v1.1.0 · 2026-09-02 · Include workspace static assets in packaged installations.
# v1.0.0 · 2026-09-02 · Lean API package independent of archived agent runner.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ep052-lean-exchange"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9", "httpx>=0.27"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
lean_exchange = ["web/*.html", "web/*.css", "web/*.js"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
