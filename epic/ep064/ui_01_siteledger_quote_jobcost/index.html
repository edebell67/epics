const qVal=q=>q.items.reduce((a,i)=>a+Number(i.amt||0),0);
const qMat=q=>q.items.filter(i=>i.kind==='materials').reduce((a,i)=>a+Number(i.amt||0),0);
const first=n=>n.split(' ')[0];
function qState(q){
 if(['Draft','Won','Lost'].includes(q.status))return q.status;
 const age=diff(q.sentAt),since=diff(q.lastContact||q.sentAt),seq=S.settings.seq;
 if(since>=14||(q.followUps>=seq.length&&since>=3))return 'Ghosted';
 const step=seq[q.followUps];
 if(step===undefined)return 'Waiting';
 if(age>=step)return age>step+3?'Overdue':'Due';
 return 'Fresh';
}
function nextStepLabel(q){const i=Math.min(q.followUps,2);return STEP_NAMES[i].replace('{d}',S.settings.seq[i])}
function fill(tpl,q){return tpl.replace(/{first}/g,first(q.cust)).replace(/{no}/g,q.no).replace(/{title}/g,q.title.toLowerCase()).replace(/{value}/g,gbp(qVal(q))).replace(/{biz}/g,BIZ)}
function nextQuoteNo(){const m=Math.max(...S.quotes.map(q=>+q.no.slice(2)));return 'Q-'+String(m+1).padStart(4,'0')}
function nextJobNo(){const m=Math.max(...S.jobs.map(j=>+j.no.slice(2)));return 'J-'+String(m+1).padStart(4,'0')}
const jobRcpts=j=>S.receipts.filter(r=>r.jobNo===j.no);
const jobMat=j=>jobRcpts(j).reduce((a,r)=>a+r.amount,0);
const jobMargin=j=>(j.value-jobMat(j)-j.labourCost)/j.value;
const openJobs=()=>S.jobs.filter(j=>j.status!=='Complete');
/* match receipt text → job. surname +60, title keyword +20 each (cap 98) */
function matchJob(text){
 const t=(' '+String(text).toLowerCase().replace(/[^a-z0-9 ]/g,' ')+' ');let best=null;
 openJobs().forEach(j=>{let s=0;const sur=j.cust.split(' ').slice(-1)[0].toLowerCase();if(t.includes(' '+sur+' '))s+=60;
  const kws=j.title.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3);const syn={bathroom:['shower','basin','toilet','bath','valve'],kitchen:['worktop','cabinet','units'],shop:['fit','shelving']};
  kws.forEach(w=>{if(t.includes(' '+w+' '))s+=20;(syn[w]||[]).forEach(x=>{if(t.includes(x))s+=22})});
  if(!best||s>best.score)best={job:j.no,score:s}});
 if(!best||best.score===0)return {job:null,conf:0};return {job:best.job,conf:Math.min(98,best.score+(best.score>=60?30:12))};
}
function parseNote(txt){
 const s=String(txt);let amt=null;const m=s.match(/£\s?(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/)||s.match(/(\d+(?:\.\d{1,2})?)\s?(?:quid|pounds|gbp)/i);
 if(m)amt=parseFloat(m[1].replace(/,/g,''));
 let supplier=SUPPLIERS.find(x=>s.toLowerCase().includes(x.toLowerCase()));
 if(!supplier){const a=s.match(/\bat\s+([A-Z][\w&']*(?:\s+[A-Z][\w&']*)*)/);supplier=a?a[1]:'Unknown supplier'}
 const what=(s.match(/\bfor\s+(?:the\s+)?(.+?)(?:\s+job)?[.!]?$/i)||[])[1]||'';
 const mt=matchJob(s);
 return {source:'voice',supplier,amount:amt,vat:amt?+(amt/6).toFixed(2):0,items:[{d:what?('For '+what):'Goods (from note)',amt:amt||0}],note:'"'+s+'"',job:mt.job,conf:amt?mt.conf:0,error:amt?null:'No amount found – include a £ value, e.g. "£140"'};
}
function parseScan(sc){
 const sub=sc.items.reduce((a,i)=>a+i.amt,0);const total=sc.vatInc?sub:+(sub*1.2).toFixed(2);
 const mt=matchJob(sc.ref+' '+sc.items.map(i=>i.d).join(' '));
 return {source:'photo',scanKey:sc.key,supplier:sc.supplier,amount:+total.toFixed(2),vat:+(total/6).toFixed(2),items:sc.items,note:sc.ref?('Ref on receipt: "'+sc.ref+'"'):'No job reference on receipt',job:mt.job,conf:mt.conf};
}

  <div class="card"><h3>Unassigned inbox ${un.length?`<span class="badge">${un.length}</span>`:''}</h3>
   <div class="list">${un.length?un.map(r=>`<div class="li"><div class="meta"><b>${srcIcon(r.source)} ${esc(r.supplier)} · ${gbp2(r.amount)}</b><span>${fmtD(r.date)} · ${esc(r.note||r.items.map(i=>i.d).join(', '))}</span></div>
    <select id="as_${r.id}"><option value="">Assign to…</option>${openJobs().map(j=>`<option value="${j.no}">${j.no} ${esc(j.cust.split(' ').pop())}</option>`).join('')}<option value="__overhead">Business overhead</option></select><button class="btn sm pri" data-act="assign" data-id="${r.id}">Save</button></div>`).join(''):'<div class="empty">Inbox zero 🎉</div>'}</div></div>
 </div></div>
 <h3 style="margin:18px 0 8px">All receipts</h3><div class="card tablewrap"><table class="rt"><thead><tr><th>ID</th><th>Date</th><th>Source</th><th>Supplier</th><th>Items</th><th class="num">VAT</th><th class="num">Total</th><th>Job</th></tr></thead><tbody>
 ${S.receipts.slice().reverse().map(r=>`<tr><td data-label="Receipt" class="mono">${r.id}</td><td data-label="Date">${fmtD(r.date)}</td><td data-label="Source">${srcIcon(r.source)} ${r.source}</td><td data-label="Supplier"><b>${esc(r.supplier)}</b></td><td data-label="Items" style="color:var(--mut);font-size:12.5px">${esc(r.items.map(i=>i.d).join(', '))}</td><td data-label="VAT" class="num">${gbp2(r.vat)}</td><td data-label="Total" class="num"><b>${gbp2(r.amount)}</b></td><td data-label="Job" class="mono">${r.jobNo==='__overhead'?'Overhead':r.jobNo||'<span class="pill p-Ghosted">unassigned</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function vPreview(P){if(P.error)return `<h3>Parse preview</h3><div class="alertbox">${esc(P.error)}</div><div class="kv"><span>Note</span><span>${esc(P.note)}</span></div>`;
 const j=S.jobs.find(x=>x.no===P.job);const after=j?(j.value-jobMat(j)-P.amount-j.labourCost)/j.value:null;
 return `<div class="preview"><h3>${srcIcon(P.source)} Extracted ${P.source==='photo'?'from receipt scan':'from note'}</h3>
 <div class="kv"><span>Supplier</span><span><b>${esc(P.supplier)}</b></span><span>Total</span><span><b>${gbp2(P.amount)}</b> <span style="color:var(--mut)">(VAT ${gbp2(P.vat)})</span></span>
 <span>Line items</span><span>${P.items.map(i=>`${esc(i.d)} – ${gbp2(i.amt)}`).join('<br>')}</span><span>Evidence</span><span style="color:var(--mut)">${esc(P.note)}</span>
 <span>Suggested job</span><span>${j?`<b class="mono">${j.no}</b> ${esc(j.cust)} · ${esc(j.title)}`:'<span style="color:var(--red)">No confident match</span>'}</span>
 <span>Confidence</span><span class="conf"><span class="bar ${P.conf<50?'over':P.conf<75?'warn':''}"><i style="width:${P.conf}%"></i></span>${P.conf}%</span></div>
 ${j?`<div class="${after<.25?'alertbox':'okbox'}">Margin impact on ${j.no}: ${(jobMargin(j)*100).toFixed(1)}% → <b>${(after*100).toFixed(1)}%</b>${jobMat(j)+P.amount>j.matBudget?' · materials will exceed budget':''}</div>`:`<div class="alertbox">Below 50% confidence – will go to the Unassigned inbox unless you pick a job.</div>`}
 <div class="fl" style="margin-top:10px"><label>Allocate to</label><select id="pvJob"><option value="">— Unassigned inbox —</option>${openJobs().map(x=>`<option value="${x.no}" ${x.no===P.job&&P.conf>=50?'selected':''}>${x.no} · ${esc(x.cust)} · ${esc(x.title)}</option>`).join('')}</select></div>
 <div class="btnrow"><button class="btn pri" data-act="confirmReceipt">Confirm &amp; save</button><button class="btn ghost" data-act="discardPreview">Discard</button></div></div>`}

function vSettings(){const s=S.settings;return `<h2>Follow-up rules</h2><div class="grid c2"><div class="card"><h3>Sequence</h3>
 <p style="color:var(--mut);margin-top:0;font-size:13px">A quote becomes <b>Due</b> when it reaches the next step day (counted from the send date), <b>Overdue</b> 3+ days after that, and <b>Ghosted</b> after the last step with no reply for 3 days, or 14 days of silence.</p>
 ${s.seq.map((d,i)=>`<div class="fl"><label>${STEP_NAMES[i].replace('Day {d} · ','Step '+(i+1)+' · ')} – day after sending</label><input type="number" min="1" max="60" value="${d}" id="seq${i}"></div><div class="fl"><label>Template</label><textarea rows="3" id="tpl${i}">${esc(s.templates[i])}</textarea></div>`).join('')}
 <button class="btn pri" data-act="saveSettings">Save rules</button></div>
 <div class="card"><h3>Placeholders</h3><div class="kv"><span>{first}</span><span>Customer first name</span><span>{no}</span><span>Quote number</span><span>{title}</span><span>Job title</span><span>{value}</span><span>Quote total</span><span>{biz}</span><span>Your business name</span></div>
 <h3 style="margin-top:18px">Preview (Grace Hughes, step 1)</h3><div class="phone"><div class="bubble">${esc(fill(s.templates[0],S.quotes.find(q=>q.no==='Q-0104')||S.quotes[0]))}</div></div></div></div>`}

/* ---------- modals ---------- */
function openModal(h){$('#modal').innerHTML=h;$('#mask').classList.add('on')}
function closeModal(){$('#mask').classList.remove('on');UI.fu=null}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function mFollowUp(no){const q=S.quotes.find(x=>x.no===no);const i=Math.min(q.followUps,2);UI.fu=UI.fu&&UI.fu.no===no?UI.fu:{no,ch:'SMS',txt:fill(S.settings.templates[i],q)};const f=UI.fu;
 openModal(`<h2>Follow up ${q.no} <button class="btn ghost" data-act="close">✕</button></h2>
 <div class="row"><span>${esc(q.cust)} · ${esc(q.title)} · ${gbp(qVal(q))}</span>${pill(qState(q))}</div><div class="row"><span>Template</span><b>${qState(q)==='Ghosted'?'Revival · ':''}${nextStepLabel(q)}</b></div>
 <div style="margin:10px 0" class="seg">${['SMS','Email'].map(c=>`<button class="${f.ch===c?'on':''}" data-act="fuCh" data-id="${c}">${c==='SMS'?'💬 SMS':'✉️ Email'}</button>`).join('')}</div>
 <div style="color:var(--mut);font-size:12.5px">To: ${f.ch==='SMS'?esc(q.phone):esc(q.email)}</div>
 <textarea id="fuTxt" rows="4" style="margin-top:6px">${esc(f.txt)}</textarea>
 <div class="phone"><div class="bubble" id="fuPrev">${esc(f.txt)}</div></div>
 <div class="modal-actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn pri" data-act="sendFu" data-id="${q.no}">Send ${f.ch} (demo)</button></div>`);
 $('#fuTxt').addEventListener('input',e=>{UI.fu.txt=e.target.value;$('#fuPrev').textContent=e.target.value})}
function mQuote(no){const q=S.quotes.find(x=>x.no===no);const s=qState(q);
 openModal(`<h2><span><span class="mono">${q.no}</span> · ${esc(q.title)}</span><button class="btn ghost" data-act="close">✕</button></h2>
 <div class="row"><span>${esc(q.cust)} · ${esc(q.phone)} · ${esc(q.email)}</span>${pill(s)}</div>
 <table class="plain" style="margin:10px 0"><thead><tr><th>Item</th><th>Type</th><th class="num">Amount</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${esc(i.d)}</td><td>${i.kind}</td><td class="num">${gbp(i.amt)}</td></tr>`).join('')}<tr><td colspan="2"><b>Total</b></td><td class="num"><b>${gbp(qVal(q))}</b></td></tr></tbody></table>
 <h3>Timeline</h3><div class="tl">${q.hist.map(h=>`<div><time>${fmtD(h.t)}</time>${esc(h.m)}</div>`).join('')}</div>
 ${['Fresh','Due','Overdue','Waiting','Ghosted'].includes(s)?`<h3 style="margin-top:12px">Simulate customer response</h3><div class="btnrow"><button class="btn pri" data-act="markWon" data-id="${q.no}">✔ Accepted</button><button class="btn dan" data-act="markLost" data-id="${q.no}">✖ Declined</button><button class="btn" data-act="followUp" data-id="${q.no}">Follow up</button></div>`:''}
 ${s==='Won'&&!q.jobNo?`<div class="modal-actions"><button class="btn pri" data-act="convert" data-id="${q.no}">Convert to job</button></div>`:''}`)}
function mNewQuote(){UI.nq=UI.nq||{items:[{d:'Materials & supplies',kind:'materials',amt:''},{d:'Labour',kind:'labour',amt:''}]};const n=UI.nq;
 openModal(`<h2><span>New quote <span class="mono" style="font-size:13px;color:var(--acc)">${nextQuoteNo()}</span></span><button class="btn ghost" data-act="close">✕</button></h2>
 <div class="fg"><div class="fl"><label>Customer name *</label><input id="nqC" value="${esc(n.c||'')}" placeholder="e.g. Ben Carter"></div><div class="fl"><label>Job title *</label><input id="nqT" value="${esc(n.t||'')}" placeholder="e.g. Garage conversion"></div>
 <div class="fl"><label>Mobile</label><input id="nqP" value="${esc(n.p||'')}" placeholder="07700 900000"></div><div class="fl"><label>Email</label><input id="nqE" value="${esc(n.e||'')}" placeholder="name@example.com"></div></div>
 <label style="font-size:12px;color:var(--mut)">Line items *</label><div class="items" id="nqItems">${n.items.map((it,i)=>`<div class="it"><input data-i="${i}" data-f="d" value="${esc(it.d)}" placeholder="Description"><select data-i="${i}" data-f="kind"><option ${it.kind==='materials'?'selected':''}>materials</option><option ${it.kind==='labour'?'selected':''}>labour</option></select><input data-i="${i}" data-f="amt" type="number" min="0" value="${it.amt}" placeholder="£"><button data-act="nqDel" data-id="${i}" title="Remove">✕</button></div>`).join('')}</div>
 <button class="btn sm" data-act="nqAdd">+ Add line</button> <span style="float:right">Total <b id="nqTot">${gbp(n.items.reduce((a,i)=>a+Number(i.amt||0),0))}</b></span>
 <div id="nqErr" style="color:var(--red);font-size:12.5px;min-height:18px;margin-top:8px"></div>
 <div class="modal-actions"><button class="btn" data-act="nqSave" data-id="draft">Save draft</button><button class="btn pri" data-act="nqSave" data-id="send">Save &amp; send</button></div>`);
 const sync=()=>{n.c=$('#nqC').value;n.t=$('#nqT').value;n.p=$('#nqP').value;n.e=$('#nqE').value;document.querySelectorAll('#nqItems [data-f]').forEach(el=>{n.items[+el.dataset.i][el.dataset.f]=el.value});$('#nqTot').textContent=gbp(n.items.reduce((a,i)=>a+Number(i.amt||0),0))};
 $('#modal').oninput=sync;$('#modal').onchange=sync}
function mWalk(){openModal(`<h2>Demo walkthrough (≈3 min)<button class="btn ghost" data-act="close">✕</button></h2><div class="walk"><ol>
 <li><b>Dashboard</b> – KPIs show open pipeline, follow-ups due, ghosted £ at risk and live job margin.</li>
 <li><b>Follow up Grace Hughes (Q-0104)</b> – Day-3 nudge template is pre-filled; switch SMS/Email; send. The quote leaves today's list and its follow-up dots advance.</li>
 <li><b>Revive Helen Ford (Q-0108)</b> – a ghosted £2,950 quote; send the last-call revival.</li>
 <li><b>Convert Ahmed Khan's accepted quote (Q-0111)</b> into job <span class="mono">J-0044</span> – numbering and budgets carry over.</li>
 <li><b>Receipts → scan the Travis Perkins receipt</b> – supplier, VAT, items and job (J-0041 Smith kitchen) are matched with confidence and the margin impact is previewed. Confirm.</li>
 <li><b>Parse a voice note</b> – "£212 at Jewson for the Khan shop fit-out" → allocates to the new J-0044.</li>
 <li><b>Scan the Shell fuel receipt</b> – no job match → goes to the Unassigned inbox; assign it as overhead.</li>
 <li><b>Jobs</b> – J-0042 Patel bathroom shows a materials overrun alert; margin drops below target.</li>
 <li><b>New quote</b> – gets the next sequential number automatically (Q-0113).</li>
 <li><b>Follow-up rules</b> – change the sequence days/templates and watch statuses recalculate.</li></ol>
 <p style="color:var(--mut);font-size:12.5px">Use "Reset demo data" in the black strip to start again.</p></div>`)}

/* ---------- actions ---------- */
const A={
 view:id=>{UI.view=id;closeModal();render();scrollTo(0,0)},
 qfilter:id=>{UI.qfilter=id;render()},
 close:closeModal,walkthrough:mWalk,
 reset:()=>{if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);S=seed();UI={view:'dashboard',qfilter:'All',preview:null,scanning:null,fu:null};render();toast('Demo data reset')}},
 newQuote:()=>{UI.nq=null;mNewQuote()},
 nqAdd:()=>{UI.nq.items.push({d:'',kind:'materials',amt:''});mNewQuote()},
 nqDel:id=>{UI.nq.items.splice(+id,1);mNewQuote()},
 nqSave:mode=>{const n=UI.nq;const items=n.items.filter(i=>i.d&&Number(i.amt)>0).map(i=>({d:i.d,kind:i.kind,amt:Number(i.amt)}));
  if(!n.c||!n.t||!items.length){$('#nqErr').textContent='Customer, job title and at least one priced line item are required.';return}
  const no=nextQuoteNo();const q={no,cust:n.c,phone:n.p||'—',email:n.e||'—',title:n.t,items,status:mode==='send'?'Sent':'Draft',sentAt:mode==='send'?iso(TODAY):null,followUps:0,lastContact:null,jobNo:null,created:iso(TODAY),hist:[{t:iso(TODAY),m:'Quote created'}]};
  if(mode==='send')q.hist.push({t:iso(TODAY),m:'Quote sent by email'});S.quotes.push(q);log(`${no} ${mode==='send'?'sent to':'drafted for'} ${n.c} (${gbp(qVal(q))})`);UI.nq=null;closeModal();UI.view='quotes';UI.qfilter='All';render();toast(`${no} ${mode==='send'?'sent':'saved'} – aging clock ${mode==='send'?'started':'not started'}`)},
 openQuote:id=>mQuote(id),
 sendQuote:id=>{const q=S.quotes.find(x=>x.no===id);q.status='Sent';q.sentAt=iso(TODAY);q.hist.push({t:iso(TODAY),m:'Quote sent by email'});log(`${q.no} sent to ${q.cust} (${gbp(qVal(q))})`);render();toast(q.no+' sent')},
 followUp:id=>{UI.fu=null;mFollowUp(id)},
 fuCh:c=>{UI.fu.ch=c;mFollowUp(UI.fu.no)},
 sendFu:id=>{const q=S.quotes.find(x=>x.no===id);const wasG=qState(q)==='Ghosted';q.followUps=Math.min(q.followUps+1,S.settings.seq.length);q.lastContact=iso(TODAY);
  q.hist.push({t:iso(TODAY),m:`${wasG?'Revival':'Follow-up #'+q.followUps} sent (${UI.fu.ch})`});log(`${wasG?'Revival':'Follow-up'} ${UI.fu.ch} sent to ${q.cust} (${q.no})`);closeModal();render();toast(`${UI.fu?UI.fu.ch:'Message'} sent to ${first(q.cust)} – status now ${qState(q)}`)},
 markWon:id=>{const q=S.quotes.find(x=>x.no===id);q.status='Won';q.lastContact=iso(TODAY);q.hist.push({t:iso(TODAY),m:'Customer accepted'});log(`🎉 ${q.cust} accepted ${q.no} (${gbp(qVal(q))})`);closeModal();render();toast(q.no+' marked Won – convert it to a job')},
 markLost:id=>{const q=S.quotes.find(x=>x.no===id);q.status='Lost';q.hist.push({t:iso(TODAY),m:'Closed as lost'});log(`${q.no} closed as lost`);closeModal();render();toast(q.no+' closed')},
 convert:id=>{const q=S.quotes.find(x=>x.no===id);if(q.jobNo)return;const no=nextJobNo();const lab=q.items.filter(i=>i.kind==='labour').reduce((a,i)=>a+i.amt,0);
  S.jobs.push({no,quote:q.no,cust:q.cust,title:q.title,value:qVal(q),matBudget:qMat(q),labourCost:Math.round(lab*.45),status:'In progress',started:iso(TODAY)});q.jobNo=no;q.hist.push({t:iso(TODAY),m:'Converted to job '+no});
  log(`${q.no} converted to job ${no} (${q.cust})`);closeModal();UI.view='jobs';render();toast(`Job ${no} created from ${q.no}`)},
 completeJob:id=>{const j=S.jobs.find(x=>x.no===id);j.status='Complete';log(`${j.no} completed – final margin ${(jobMargin(j)*100).toFixed(1)}%`);render();toast(j.no+' completed')},
 captureNav:()=>{UI.view='receipts';closeModal();render();scrollTo(0,0)},
 scan:id=>{if(UI.scanning)return;UI.scanning=id;UI.preview=null;render();setTimeout(()=>{UI.preview=parseScan(S.sampleScans.find(s=>s.key===id));UI.scanning=null;render()},900)},
 example:t=>{$('#note').value=t},
 parseNote:()=>{const v=$('#note').value.trim();if(!v){toast('Type or dictate a note first');return}UI.preview=parseNote(v);render()},
 dictate:()=>{const text='£212 at Jewson for the Khan shop fit-out';const el=$('#note');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const sim=()=>{el.value='';let i=0;toast('🎙 Demo dictation…');const h=setInterval(()=>{el.value=text.slice(0,++i);if(i>=text.length)clearInterval(h)},28)};
  if(!SR||location.protocol==='file:'){sim();return}try{const r=new SR();r.lang='en-GB';r.onresult=e=>{el.value=e.results[0][0].transcript};r.onerror=sim;r.start();toast('🎙 Listening…')}catch(e){sim()}},
 discardPreview:()=>{UI.preview=null;render()},
 confirmReceipt:()=>{const P=UI.preview;const job=$('#pvJob').value||null;const id='R-'+(Math.max(...S.receipts.map(r=>+r.id.slice(2)))+1);
  S.receipts.push({id,supplier:P.supplier,amount:P.amount,vat:P.vat,date:iso(TODAY),jobNo:job,source:P.source,items:P.items,note:P.note});if(P.scanKey)S.usedScans.push(P.scanKey);
  const j=S.jobs.find(x=>x.no===job);log(job?`Receipt ${id} ${P.supplier} ${gbp2(P.amount)} → ${job} (margin now ${(jobMargin(j)*100).toFixed(1)}%)`:`Receipt ${id} ${P.supplier} ${gbp2(P.amount)} sent to inbox`);
  UI.preview=null;render();toast(job?`Allocated to ${job} – margin ${(jobMargin(j)*100).toFixed(1)}%`:'Saved to Unassigned inbox')},
 assign:id=>{const v=$('#as_'+id).value;if(!v){toast('Pick a job first');return}const r=S.receipts.find(x=>x.id===id);r.jobNo=v;log(`Receipt ${id} assigned to ${v==='__overhead'?'overhead':v}`);render();toast('Receipt assigned')},
 saveSettings:()=>{const seq=[0,1,2].map(i=>Math.max(1,parseInt($('#seq'+i).value)||1));if(!(seq[0]<seq[1]&&seq[1]<seq[2])){toast('Step days must increase (e.g. 3, 7, 14)');return}
  S.settings.seq=seq;S.settings.templates=[0,1,2].map(i=>$('#tpl'+i).value);log(`Follow-up sequence updated to days ${seq.join(', ')}`);render();toast('Rules saved – statuses recalculated')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();const f=A[b.dataset.act];if(f)f(b.dataset.id,b)});
render();
</script></body></html>
