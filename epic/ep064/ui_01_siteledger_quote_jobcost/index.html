function matchJob(text){

 openJobs().forEach(j=>{let s=0;const sur=j.cust.split(' ').slice(-1)[0].toLowerCase();if(t.includes(' '+sur+' '))s+=60;

function lateInterest(v){
 if(!v.b2b)return null;const od=invOD(v),out=invOut(v);if(od<=0||out<=0)return null;

async function submitInterestLead(prod){
  const emailInput = document.querySelector('#slInterestEmail');
  const email = emailInput ? emailInput.value.trim() : '';
  const status = document.querySelector('#slInterestStatus');
  const btn = document.querySelector('#slSubmitInterestBtn');
  if(!email||!/^\S+@\S+\.\S+$/.test(email)){
    if(status){status.style.color='var(--red)';status.textContent='Please enter a valid email address.';}
    return;
  }
  const consentEl = document.querySelector('#slInterestConsent');
  const consent = consentEl ? consentEl.checked : true;
  if(!consent){
    if(status){status.style.color='var(--red)';status.textContent='Please agree to receive waitlist updates.';}
    return;
  }
  const tradeEl = document.querySelector('#slInterestTrade');
  const trade = tradeEl ? tradeEl.value : 'Carpentry & Joinery';
  const feats=[...document.querySelectorAll('input[name="slInterestFeat"]:checked')].map(c=>c.value);
  const notesEl = document.querySelector('#slInterestNotes');
  const notes = notesEl ? notesEl.value.trim() : '';

  const lead={
    product:'siteledger',
    email,
    trade,
    features:feats,
    notes,
    date:new Date().toISOString(),
    landingPath:window.location.pathname
  };

  try{
    const stored=JSON.parse(localStorage.getItem('siteledger_interest_leads')||'[]');
    stored.push(lead);
    localStorage.setItem('siteledger_interest_leads',JSON.stringify(stored));
  }catch(e){}

  btn.disabled=true;
  if(status){status.style.color='var(--blue)';status.textContent='Registering your interest...';}

  try{
    await fetch('https://ep052-agentic-arena.onrender.com/api/waitlist',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        email:email,
        discoverySource:'siteledger_demo',
        sourceDetail:`Trade: ${trade} | Feats: ${feats.join(', ')} | Note: ${notes}`,
        landingPath:window.location.pathname,
        referrer:document.referrer||null
      })
    });
  }catch(err){}

  if(status){
    status.style.color='var(--acc)';
    status.innerHTML='<b>🎉 You are on the priority waitlist!</b> We have logged your votes for '+feats.length+' features. We will email '+email+' as soon as beta invites open for '+esc(trade)+'.';
  }
  btn.textContent='✓ Registered';
  btn.style.background='var(--blue)';
  btn.style.borderColor='var(--blue)';
  setTimeout(()=>{
    toast('🎉 Registered for SiteLedger early access!');
  },1000);
}

  UI.preview=null;render();toast(job?`Allocated to ${job} – margin ${(jobMargin(j)*100).toFixed(1)}%`:'Saved to Unassigned inbox')},
 assign:id=>{const v=$('#as_'+id).value;if(!v){toast('Pick a job first');return}const r=S.receipts.find(x=>x.id===id);r.jobNo=v;log(`Receipt ${id} assigned to ${v==='__overhead'?'overhead':v}`);render();toast('Receipt assigned')},
 saveSettings:()=>{const seq=[0,1,2].map(i=>Math.max(1,parseInt($('#seq'+i).value)||1));if(!(seq[0]<seq[1]&&seq[1]<seq[2])){toast('Step days must increase (e.g. 3, 7, 14)');return}
  const lad=[0,1,2,3].map(i=>Math.max(0,parseInt($('#lad'+i).value)||0));if(!(lad[0]<lad[1]&&lad[1]<lad[2]&&lad[2]<lad[3])){toast('Chase ladder days must increase (e.g. 0, 7, 14, 30)');return}
  S.settings.seq=seq;S.settings.templates=[0,1,2].map(i=>$('#tpl'+i).value);S.settings.ladder=lad;S.settings.invTemplates=[0,1,2,3].map(i=>$('#itpl'+i).value);
  S.settings.baseRate=Math.max(0,parseFloat($('#baseRate').value)||0);log(`Rules updated: follow-ups ${seq.join(', ')} · chase ladder ${lad.join(', ')}`);render();toast('Rules saved – statuses recalculated')},
 chase:id=>{UI.ch=null;mChase(id)},
 chCh:c=>{UI.ch.ch=c;mChase(UI.ch.no)},
 sendChase:id=>{const c=UI.ch;doChase(id,c.ch,c.txt);closeModal();UI.ch=null;render();const v=S.invoices.find(x=>x.no===id);toast(`${c.ch} sent to ${first(v.cust)} – ${invState(v)}`)},
 payment:id=>mPayment(id),
 savePayment:id=>{const a=parseFloat($('#payAmt').value);if(!(a>0)){toast('Enter an amount');return}recordPayment(id,a);closeModal();render();const v=S.invoices.find(x=>x.no===id);toast(invOut(v)<=0.005?`${id} paid in full`:`${gbp2(invOut(v))} still outstanding on ${id}`)},
 invoiceJob:id=>{const j=S.jobs.find(x=>x.no===id);const amt=+(j.value-jobInvoiced(j)).toFixed(2);if(amt<=0)return;const q=S.quotes.find(x=>x.no===j.quote)||{};const no=nextInvNo();
  S.invoices.push({no,cust:j.cust,b2b:/Ltd|Stores/.test(j.cust)||/shop/i.test(j.title),phone:q.phone||'—',email:q.email||'—',jobNo:j.no,title:j.title+(jobInvoiced(j)?' – balance':''),amount:amt,issued:iso(TODAY),terms:14,payments:[],chases:0,lastChase:null,lastMsg:null,hist:[{t:iso(TODAY),m:'Invoice issued'}]});
  log(`${no} issued to ${j.cust} for ${gbp2(amt)} (${j.no})`);UI.view='invoices';render();toast(`${no} issued – due in 14 days`)},
 tq:id=>{UI.tq=+id;render()},
 setCat:id=>{const v=$('#cat_'+id).value;if(!v){toast('Choose a category first');return}const b=S.ledger.find(x=>x.id===id),r=S.receipts.find(x=>x.id===id);if(b)b.cat=v;if(r)r.cat=v;
  log(`${id} categorised as ${v==='personal'?'personal (excluded)':CATS[v]}`);render();toast('Categorised')},
 prepareQ:id=>{const q=TAXY.quarters[+id][0];S.mtd.prepared[q]=iso(TODAY);log(`MTD ${q} update prepared (demo – not sent to HMRC)`);render();toast(`${q} prepared – not sent`)},
 play:id=>{if(!SC[id])return;PB.id=id;PB.playing=true;pbGo(0)},
 pbToggle:()=>{const last=PB.step===SC[PB.id].steps.length-1;if(last&&!PB.playing){PB.playing=true;pbGo(0);return}PB.playing=!PB.playing;if(PB.playing)pbSchedule();else clearTimeout(PB.timer);pbPanel()},
 pbPrev:()=>{PB.playing=false;pbGo(PB.step-1)},
 pbNext:()=>{PB.playing=false;pbGo(PB.step+1)},
 pbRestart:()=>{PB.playing=true;pbGo(0)},
 pbSpeed:()=>{PB.speed=PB.speed===1?2:1;pbSchedule();pbPanel()},
 pbExit:()=>pbExit()
};

const setDay=n=>{TODAY=new Date(BASE);TODAY.setDate(TODAY.getDate()+n)};

function pbBuild(id,n){S=seed();UI.tq=null;const sc=SC[id];for(let i=0;i<=n;i++){const st=sc.steps[i];if(st.fx)st.fx()}}
function pbGo(n){const sc=SC[PB.id];n=Math.max(0,Math.min(sc.steps.length-1,n));PB.step=n;closeModal();pbBuild(PB.id,n);UI.view=sc.steps[n].view||UI.view;render();pbSchedule();pbPanel();pbScroll()}
function pbSchedule(){clearTimeout(PB.timer);if(!PB.id||!PB.playing)return;const sc=SC[PB.id];if(PB.step>=sc.steps.length-1){PB.playing=false;return}
 const st=sc.steps[PB.step];PB.timer=setTimeout(()=>pbGo(PB.step+1),(2600+(txt(st.title)+txt(st.body)).length*42)/PB.speed)}
function pbPanel(){const el=$('#pb');if(!PB.id){el.classList.remove('on');el.innerHTML='';document.body.classList.remove('pb-on');return}
 const sc=SC[PB.id],st=sc.steps[PB.step],last=PB.step===sc.steps.length-1;
 el.innerHTML=`<div class="pb-head"><span class="pb-tag">▶ Playback · ${esc(sc.title)}</span><span class="mono">${PB.step+1}/${sc.steps.length} · ${st.at}</span><button class="pb-x" data-act="pbExit" aria-label="Close playback">✕</button></div>
  <div class="pb-prog"><i style="width:${((PB.step+1)/sc.steps.length*100).toFixed(0)}%"></i></div><b class="pb-title">${esc(txt(st.title))}</b><p class="pb-body">${esc(txt(st.body))}</p>
  <div class="pb-ctl"><button data-act="pbRestart" aria-label="Restart">⏮</button><button data-act="pbPrev" aria-label="Previous step" ${PB.step?'':'disabled'}>‹</button>
  <button class="main" data-act="pbToggle">${last&&!PB.playing?'↻ Replay':PB.playing?'⏸ Pause':'▶ Play'}</button><button data-act="pbNext" aria-label="Next step" ${last?'disabled':''}>›</button><button data-act="pbSpeed" aria-label="Playback speed">${PB.speed}x</button></div>`;
 el.classList.add('on');document.body.classList.add('pb-on');document.body.style.setProperty('--pbh',el.offsetHeight+'px')}
const pbSel=f=>f.endsWith('*')?`[data-pb^="${f.slice(0,-1)}"]`:`[data-pb="${f}"]`;
function pbHighlight(){if(!PB.id)return;(SC[PB.id].steps[PB.step].focus||[]).forEach(f=>document.querySelectorAll(pbSel(f)).forEach(e=>e.classList.add('pb-hl')))}
function pbScroll(){const f=(SC[PB.id].steps[PB.step].focus||[])[0];const hit=f&&document.querySelector(pbSel(f));if(!hit)return;
 const el=hit.matches('.li,tr')?hit:(hit.closest('.card')||hit);const top=el.getBoundingClientRect().top+scrollY-$('.top').offsetHeight-14;scrollTo({top:Math.max(0,top),behavior:'smooth'})}
function pbExit(){clearTimeout(PB.timer);PB.id=null;PB.playing=false;render()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;e.preventDefault();const act=b.dataset.act;
 if(PB.id&&!PB_OK.has(act))pbExit();if(PB.id&&(act==='view'||act==='tq')){PB.playing=false;clearTimeout(PB.timer)}const f=A[act];if(f)f(b.dataset.id,b)});
render();
(()=>{const p=new URLSearchParams(location.search).get('play');if(p&&SC[p])A.play(p)})();
