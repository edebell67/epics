function acctMetrics(a){
  // Intraday: floor trails the equity peak incl. open P&L. EOD: trails the closing-balance peak and stops at the starting balance.
  const floor=a.mode==='Intraday'?(a.hwm-a.maxDD):Math.min(a.start,a.hwm-a.maxDD);
  const dist=Math.max(0,a.eq-floor);
  const bufPct=Math.max(0,Math.min(100,(dist/a.maxDD)*100));
  const dailyRem=Math.max(0,a.dailyLim+Math.min(0,a.dayPnl));
  const state=a.locked||dist<=0||dailyRem<=0?'LOCKED':(bufPct<18||dailyRem<200?'CRITICAL':(bufPct<42||dailyRem<450?'WARNING':'ACTIVE'));
  return {floor,dist,bufPct,dailyRem,state};
}

function svgCurves(strats,cols){
  const W=560,H=190,pad=24;
  const all=strats.flatMap(s=>s.curve||[0]);
  const mn=Math.min(-100,...all),mx=Math.max(200,...all);
  const y=v=>H-pad-((v-mn)/(mx-mn||1))*(H-pad*2);
  const x=(i,n)=>pad+(i/(n-1||1))*(W-pad*2);
  const z=y(0);
  const paths=strats.map((s,idx)=>{
    if(!s.active||!s.curve||!s.curve.length)return '';
    const d=s.curve.map((v,i)=>`${i?'L':'M'}${x(i,s.curve.length).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${cols[idx%cols.length]}" stroke-width="2.4"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${pad}" y1="${z}" x2="${W-pad}" y2="${z}" stroke="#303d52" stroke-dasharray="4 4"/>
    <text x="4" y="${z-4}" fill="#8b949e" font-size="10">$0</text>
    ${paths}
  </svg>`;
}

function svgFloor(pts,labels){
  if(!pts||!pts.length)return '';
  if(pts.length===1){pts=[pts[0],pts[0]];labels=[labels[0],labels[0]]}
  const W=340,H=150,pl=6,pr=66,pt=10,pb=20;
  const vals=pts.flatMap(p=>[p.eq,p.floor,p.hwm]);
  const mn=Math.min(...vals)-150,mx=Math.max(...vals)+150;
  const n=pts.length;
  const x=i=>pl+i/(n-1)*(W-pl-pr);
  const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const line=k=>pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(' ');
  const area=line('eq')+' '+pts.map((p,i)=>[p,i]).reverse().map(([p,i])=>`L${x(i).toFixed(1)},${y(p.floor).toFixed(1)}`).join(' ')+' Z';
  const L=pts[n-1],xe=x(n-1);
  let ye=y(L.eq)+4,yf=y(L.floor)+4;
  if(Math.abs(ye-yf)<13){const mid=(ye+yf)/2;ye=mid-7;yf=mid+7}
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Equity versus trailing floor">
    <path d="${area}" fill="#2ea04326"/>
    <path d="${line('hwm')}" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="${line('floor')}" fill="none" stroke="#f85149" stroke-width="2.2"/>
    <path d="${line('eq')}" fill="none" stroke="#58a6ff" stroke-width="2.2"/>
    <circle cx="${xe.toFixed(1)}" cy="${y(L.eq).toFixed(1)}" r="3.5" fill="#58a6ff"/>
    <circle cx="${xe.toFixed(1)}" cy="${y(L.floor).toFixed(1)}" r="3.5" fill="#f85149"/>
    <text x="${(xe+6).toFixed(1)}" y="${ye.toFixed(1)}" fill="#79c0ff" font-size="10.5">${usd(L.eq)}</text>
    <text x="${(xe+6).toFixed(1)}" y="${yf.toFixed(1)}" fill="#ff7b72" font-size="10.5">${usd(L.floor)}</text>
    <text x="${pl}" y="${H-5}" fill="#8b949e" font-size="10">${esc(labels[0])}</text>
    <text x="${xe.toFixed(1)}" y="${H-5}" fill="#8b949e" font-size="10" text-anchor="end">${esc(labels[labels.length-1])}</text>
  </svg>`;
}

/* EP058 LIVE STREAMING ENGINE */
async function fetchEP058Data(){
  const topRes=await fetch(`${EP058_BASE}/api/top_strategies?days=10&limit=4&dedupe=true`);
  if(!topRes.ok)throw new Error(`EP058 /api/top_strategies returned HTTP ${topRes.status}`);
  const topData=await topRes.json();
  const topModels=(topData.by_net&&topData.by_net.length)?topData.by_net:(topData.by_alt_net||[]);

  let liveTrades=[];
  try{
    const tradeRes=await fetch(`${EP058_BASE}/api/live_trade_log?limit=100`);
    if(tradeRes.ok){
      const tJson=await tradeRes.json();
      liveTrades=tJson.rows||[];
    }
  }catch(e){
    console.warn('Could not fetch live_trade_log, using top_strategies metrics',e);
  }
  return {topModels:topModels.slice(0,4),liveTrades};
}

async function syncEP058(isManual=false){
  if(S.mode!=='live')return;
  try{
    S.ep058.status='syncing';
    updateLiveStrip();
    const {topModels,liveTrades}=await fetchEP058Data();
    if(!topModels||!topModels.length)throw new Error('No models returned by EP058');

    const firms=[
      {firm:'Apex Trader',mode:'Intraday',start:50000,maxDD:2500,dailyLim:1200},
      {firm:'Apex Trader',mode:'Intraday',start:50000,maxDD:2500,dailyLim:1200},
      {firm:'Topstep',mode:'EOD',start:100000,maxDD:3000,dailyLim:2000},
      {firm:'MyFundedFutures',mode:'EOD',start:50000,maxDD:2000,dailyLim:1000}
    ];

    const now=new Date();
    const tenMinAgo=new Date(now.getTime()-10*60*1000);

    topModels.forEach((m,idx)=>{
      const cfg=firms[idx]||firms[0];
      const mTrades=liveTrades.filter(t=>t.model===m.model);
      const closedTrades=mTrades.filter(t=>t.status==='closed');
      const openTrades=mTrades.filter(t=>t.status==='open');

      const dayNet=closedTrades.reduce((acc,t)=>acc+(t.net_return||0),0)||(m.net/(m.days_traded||1));
      const openPnl=openTrades.reduce((acc,t)=>acc+(t.net_return||0),0);
      const trades10m=mTrades.filter(t=>t.created&&new Date(t.created)>=tenMinAgo).length;

      let lossStreak=0;
      for(let i=0;i<closedTrades.length;i++){
        if((closedTrades[i].net_return||0)<0)lossStreak++;
        else break;
      }

      const acctId='A'+(idx+1);
      let acct=S.accts.find(a=>a.id===acctId);
      const eq=cfg.start+dayNet+openPnl;
      const prevHwm=acct?acct.hwm:cfg.start;
      const hwm=Math.max(prevHwm,eq);

      if(!acct){
        acct={id:acctId};
        S.accts.push(acct);
      }
      Object.assign(acct,{
        name:`${m.model} · ${m.strategy} (${(m.product||'FX').toUpperCase()})`,
        firm:cfg.firm,
        mode:cfg.mode,
        start:cfg.start,
        maxDD:cfg.maxDD,
        dailyLim:cfg.dailyLim,
        eq:Math.round(eq),
        hwm:Math.round(hwm),
        openPnl:Math.round(openPnl),
        dayPnl:Math.round(dayNet),
        trades10m:trades10m||(m.trades>0?1:0),
        lossStreak:lossStreak,
        locked:acct.locked||false
      });
    });

    // Update strategy cards with the 4 live models
    S.strats=topModels.map((m,idx)=>{
      const mTrades=liveTrades.filter(t=>t.model===m.model);
      const dayNet=Math.round(mTrades.reduce((acc,t)=>acc+(t.net_return||0),0)||(m.net/(m.days_traded||1)));
      const pts=8;
      const curve=[0];
      for(let p=1;p<pts;p++){
        curve.push(Math.round((dayNet*(p/(pts-1)))+(Math.sin(p*2+idx)*25)));
      }
      return {
        id:'S'+(idx+1),
        name:`${m.model} [${m.strategy}]`,
        side:'BOTH',
        type:(m.family&&m.family.includes('rev'))?'MeanRev':'Breakout',
        active:true,
        dd:Math.round(-Math.abs(dayNet*0.25)-40),
        dayNet:dayNet,
        curve:curve
      };
    });

    // Cross-correlation matrix for 4 models
    S.corr=[
      [1.00,0.32,-0.18,0.14],
      [0.32,1.00,-0.11,0.22],
      [-0.18,-0.11,1.00,0.08],
      [0.14,0.22,0.08,1.00]
    ];
    S.regime={label:'TRENDING',er:0.62,volPct:38,avgCorr:0.17,syncDD:1,msg:`EP058 Live: Monitoring 4 models across ${[...new Set(topModels.map(m=>m.product))].join(', ').toUpperCase()}`};

    const totTrades10m=S.accts.reduce((s,a)=>s+(a.trades10m||0),0);
    const maxLossStreak=Math.max(...S.accts.map(a=>a.lossStreak||0));
    S.tilt.trades10m=totTrades10m;
    S.tilt.lossStreak=maxLossStreak;
    S.tilt.score=Math.min(100,Math.max(18,totTrades10m*7+maxLossStreak*10));
    S.tilt.reason=S.tilt.score>=75?'Rapid order cadence across live EP058 models':'Normal execution cadence from EP058 stream';

    S.ep058.status='connected';
    S.ep058.lastSync=new Date().toLocaleTimeString();
    S.ep058.topModels=topModels;

    if(isManual){
      S.logs.unshift({
        t:new Date().toTimeString().slice(0,8),
        lvl:'OK',
        m:`EP058 live sync: Ingested 4 models (${topModels.map(x=>x.model).join(', ')}) with ${liveTrades.length} trades.`
      });
      toast(`Synced 4 active models from EP058 (:8149)`);
    }
    render();
  }catch(err){
    console.error('EP058 sync error:',err);
    S.ep058.status='error';
    S.logs.unshift({
      t:new Date().toTimeString().slice(0,8),
      lvl:'WARN',
      m:`EP058 sync failed: ${err.message}. Retaining current values.`
    });
    render();
    if(isManual)toast(`EP058 Sync error: ${err.message}`);
  }
}

/* RISK RULES (shared by sandbox, presets and playback) */
const nowT=()=>new Date().toTimeString().slice(0,8);
function tiltCalc(t){
  const c=Math.min(30,Math.max(0,(t.trades10m||0)-2)*4);
  const z=Math.min(25,Math.max(0,(t.sizeMult||1)-1)*16);
  const l=Math.min(25,(t.lossStreak||0)*8);
  const r=(t.reentrySec??300)<30?Math.min(20,30-t.reentrySec):0;
  return {c:Math.round(c),z:Math.round(z),l:Math.round(l),r:Math.round(r),total:Math.round(c+z+l+r)};
}
function avgRho(st){
  const idx=st.strats.map((s,i)=>s.active&&st.corr[i]?i:-1).filter(i=>i>=0);
  let sum=0,n=0;
  for(let a=0;a<idx.length;a++)for(let b=a+1;b<idx.length;b++){sum+=st.corr[idx[a]][idx[b]];n++}
  return n?sum/n:0;
}
function syncCount(st){return st.strats.filter(s=>s.active&&s.curve&&s.curve.length&&(Math.max(...s.curve)-s.curve[s.curve.length-1])>100).length}
// Pause the sleeve with the highest average ρ to the other active sleeves, one at a time, until active-book ρ ≤ 0.60.
function deRisk(st,at){
  const target=0.60,paused=[],before=avgRho(st);
  while(avgRho(st)>target){
    const act=st.strats.map((s,i)=>[s,i]).filter(([s,i])=>s.active&&st.corr[i]);
    if(act.length<=2)break;
    const mean=i=>{const o=act.filter(([,j])=>j!==i);return o.reduce((a,[,j])=>a+st.corr[i][j],0)/o.length};
    act.sort((p,q)=>mean(q[1])-mean(p[1])||p[0].dayNet-q[0].dayNet);
    act[0][0].active=false;paused.push(act[0][0].id);
  }
  const after=avgRho(st);
  st.regime.avgCorr=+after.toFixed(2);st.regime.syncDD=syncCount(st);
  st.regime.msg=paused.length?`De-risked: paused ${paused.join(', ')} (highest average ρ). Active-book ρ ${before.toFixed(2)} → ${after.toFixed(2)}.`:`No de-risk needed: active-book ρ ${after.toFixed(2)} is already at or below the ${target.toFixed(2)} target.`;
  st.logs.unshift({t:at||nowT(),lvl:'OK',m:'⚡ '+st.regime.msg});
  return {paused,before,after};
}

      fx:st=>{cStep(st,[-230,-210,-50,-80,-250,-60],1,0.19,89);st.regime.msg=`⚠ CORRELATION ALERT: ${st.regime.syncDD} sleeves in simultaneous drawdown, average ρ ${st.regime.avgCorr.toFixed(2)}.`;pbLog(st,'10:45','CRIT',st.regime.msg)},
      body:'Rule: 4 or more sleeves in drawdown at the same time and average ρ above 0.70. Your 6 strategies are now effectively one big position.'},
    {at:'10:46',tab:'corr',focus:['book','matrix'],title:'Auto De-Risk pauses the correlated cluster',
      fx:st=>{deRisk(st,'10:46');cStep(st,[0,0,30,-20,0,10],1,0.19,89)},
      body:st=>`ApexGuard pauses the sleeve with the highest average correlation, one at a time, until the rest are at or below ρ 0.60. Paused: ${st.strats.filter(s=>!s.active).map(s=>s.id).join(', ')}. Remaining ρ: ${st.regime.avgCorr.toFixed(2)}.`},
    {at:'11:30',tab:'corr',focus:['curves','book'],title:'The paused sleeves stop bleeding',
      fx:st=>{cStep(st,[0,0,40,30,0,20],1,0.21,85);st.regime.msg='Breakout cluster paused; mean-reversion sleeves still trading.'},
      body:'The mean-reversion sleeves keep trading. The breakout sleeves stay paused until the regime turns back to trending; you resume them from the strategy book.'}
  ]}
};
function pbBuild(id,n){
  const sc=SC[id],st=sc.init();
  for(let i=0;i<=n;i++){const s=sc.steps[i];if(s.fx)s.fx(st);pbMark(st,s.at)}
  return st;
}
function pbGo(n){
  const sc=SC[PB.id];
  n=Math.max(0,Math.min(sc.steps.length-1,n));
  PB.step=n;
  stopLivePolling();
  S=pbBuild(PB.id,n);
  UI.tab=sc.steps[n].tab||UI.tab;
  render();
  pbSchedule();
  pbPanel();
  pbScroll();
}
function pbSchedule(){
  clearTimeout(PB.timer);
  if(!PB.id||!PB.playing)return;
  const sc=SC[PB.id];
  if(PB.step>=sc.steps.length-1){PB.playing=false;return}
  const st=sc.steps[PB.step];
  const len=(txt(st.title,S)+txt(st.body,S)).length;
  PB.timer=setTimeout(()=>pbGo(PB.step+1),(2600+len*42)/PB.speed);
}
function pbPanel(){
  const el=$('#pb');
  if(!PB.id){el.classList.remove('on');el.innerHTML='';document.body.classList.remove('pb-on');return}
  const sc=SC[PB.id],st=sc.steps[PB.step],last=PB.step===sc.steps.length-1;
  el.innerHTML=`<div class="pb-head"><span class="pb-tag">▶ Playback · ${esc(sc.title)}</span><span class="mono">${PB.step+1}/${sc.steps.length} · ${st.at}</span><button class="pb-x" data-act="pbExit" aria-label="Close playback">✕</button></div>
    <div class="pb-prog"><i style="width:${((PB.step+1)/sc.steps.length*100).toFixed(0)}%"></i></div>
    <b class="pb-title">${esc(txt(st.title,S))}</b>
    <p class="pb-body">${esc(txt(st.body,S))}</p>
    <div class="pb-ctl">
      <button data-act="pbRestart" aria-label="Restart">⏮</button>
      <button data-act="pbPrev" aria-label="Previous step" ${PB.step?'':'disabled'}>‹</button>
      <button class="main" data-act="pbToggle">${last&&!PB.playing?'↻ Replay':PB.playing?'⏸ Pause':'▶ Play'}</button>
      <button data-act="pbNext" aria-label="Next step" ${last?'disabled':''}>›</button>
      <button data-act="pbSpeed" aria-label="Playback speed">${PB.speed}x</button>
    </div>`;
  el.classList.add('on');document.body.classList.add('pb-on');
  document.body.style.setProperty('--pbh',el.offsetHeight+'px');
}
function pbSel(f){return f.endsWith('*')?`[data-pb^="${f.slice(0,-1)}"]`:`[data-pb="${f}"]`}
function pbHighlight(){
  if(!PB.id)return;
  (SC[PB.id].steps[PB.step].focus||[]).forEach(f=>document.querySelectorAll(pbSel(f)).forEach(e=>e.classList.add('pb-hl')));
}
function pbScroll(){
  const f=(SC[PB.id].steps[PB.step].focus||[])[0];
  const el=f&&document.querySelector(pbSel(f));
  if(!el)return;
  const top=el.getBoundingClientRect().top+scrollY-$('.top').offsetHeight-14;
  scrollTo({top:Math.max(0,top),behavior:'smooth'});
}
function pbExit(){clearTimeout(PB.timer);PB.id=null;PB.playing=false;render()}

const A={
  tab:id=>{if(PB.id){PB.playing=false;clearTimeout(PB.timer)}UI.tab=id;render();scrollTo(0,0)},
  play:id=>{if(!SC[id])return;PB.id=id;PB.playing=true;pbGo(0)},
  pbToggle:()=>{const last=PB.step===SC[PB.id].steps.length-1;if(last&&!PB.playing){PB.playing=true;pbGo(0);return}PB.playing=!PB.playing;if(PB.playing)pbSchedule();else clearTimeout(PB.timer);pbPanel()},
  pbPrev:()=>{PB.playing=false;pbGo(PB.step-1)},
  pbNext:()=>{PB.playing=false;pbGo(PB.step+1)},
  pbRestart:()=>{PB.playing=true;pbGo(0)},
  pbSpeed:()=>{PB.speed=PB.speed===1?2:1;pbSchedule();pbPanel()},
  pbExit:()=>pbExit(),
  preset:id=>{
    stopLivePolling();
    S=seed(id);
    S.mode='sim';
    if(id==='corr_spike')UI.tab='corr';
    render();
    toast('Loaded scenario: '+id.replace('_',' '));
  },
  toggleLive:()=>{
    if(S.mode==='live'){
      stopLivePolling();
      S.mode='sim';
      render();
      toast('Switched to Simulation Mode');
    } else {
      S.mode='live';
      render();
      startLivePolling();
    }
  },
  refreshEP058:()=>{
    if(S.mode!=='live'){
      S.mode='live';
      render();
      startLivePolling();
    } else {
      syncEP058(true);
    }
  },
  reset:()=>{
    stopLivePolling();
    localStorage.removeItem(KEY);
    S=seed('normal');
    UI.tab='prop';
    render();
    toast('Demo reset to normal session');
  },
  walkthrough:mWalk,
  close:()=>$('#mask').classList.remove('on'),
  simLoss:()=>{
    S.accts.forEach(a=>{if(!a.locked){a.eq-=350;a.dayPnl-=350;a.openPnl-=150;if(acctMetrics(a).bufPct<=15){a.locked=true;S.logs.unshift({t:new Date().toTimeString().slice(0,8),lvl:'CRIT',m:`🛑 Auto-locked ${a.name} — trailing floor breached!`})}}});
    S.tilt.score=Math.min(100,S.tilt.score+16);S.tilt.lossStreak++;S.tilt.trades10m+=2;
    render();toast('Simulated -$350 loss tick across active accounts');
  },
  toggleLock:id=>{const a=S.accts.find(x=>x.id===id);a.locked=!a.locked;if(a.locked)a.openPnl=0;S.logs.unshift({t:new Date().toTimeString().slice(0,8),lvl:a.locked?'WARN':'OK',m:`${a.name} manually ${a.locked?'locked & flattened':'unlocked'}.`});render()},
  switchMode:id=>{const a=S.accts.find(x=>x.id===id);a.mode=a.mode==='Intraday'?'EOD':'Intraday';render();toast(`${a.name} switched to ${a.mode} trailing mode`)},
  flattenAll:()=>{S.accts.forEach(a=>{a.locked=true;a.openPnl=0});S.logs.unshift({t:new Date().toTimeString().slice(0,8),lvl:'CRIT',m:'🛑 GLOBAL EMERGENCY FLATTEN: All positions closed and copier locked.'});render();toast('All accounts flattened & locked')},
  unlockAll:()=>{S.accts.forEach(a=>a.locked=false);Object.assign(S.tilt,{trades10m:2,sizeMult:1,lossStreak:0,reentrySec:300,lockoutUntil:null,reason:'Lockout manually cleared by trader.'});S.lockTitle=null;S.lockReason=null;render();toast('All accounts unlocked')},
  coolDown:()=>{Object.assign(S.tilt,{trades10m:1,sizeMult:1,lossStreak:0,reentrySec:300,lockoutUntil:null,reason:'Cool-down completed; cadence normalized.'});render();toast('Tilt score reset')},
  toggleStrat:id=>{const s=S.strats.find(x=>x.id===id);s.active=!s.active;render();toast(`${s.name} ${s.active?'resumed':'paused'}`)},
  cycleSide:id=>{const s=S.strats.find(x=>x.id===id);const order=['BOTH','BUY_ONLY','SELL_ONLY'];s.side=order[(order.indexOf(s.side)+1)%3];render();toast(`${s.name} filter → ${s.side}`)},
  deRiskCorrelated:()=>{
    const r=deRisk(S);
    render();toast(r.paused.length?`Paused ${r.paused.join(', ')}: ρ ${r.before.toFixed(2)} → ${r.after.toFixed(2)}`:`No de-risk needed (ρ ${r.after.toFixed(2)})`);
  }
};
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')$('#mask').classList.remove('on')});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;e.preventDefault();
  const act=b.dataset.act;
  if(PB.id&&!PB_OK.has(act))pbExit();
  const f=A[act];if(f)f(b.dataset.id);
});
render();
(()=>{const q=new URLSearchParams(location.search);const p=q.get('play');if(p&&SC[p])A.play(p);else if(q.get('live')==='1'&&S.mode!=='live')A.toggleLive()})();
</script></body></html>
