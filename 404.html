<meta name="description" content="That page doesn't exist. Head back to the homepage or browse our writing.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0A0C0E">

<main id="main">
  <section class="hero" style="min-height:100svh;align-items:center">
    <div class="hero__field" aria-hidden="true"></div>
    <div class="shell">
      <p class="eyebrow">Error 404</p>
      <h1 class="hero__title" style="font-size:clamp(2.5rem,6.5vw,5rem)">

      </p>

        <a class="btn btn--solid" href="/">Back to home<span class="btn__arrow" aria-hidden="true">→</span></a>
