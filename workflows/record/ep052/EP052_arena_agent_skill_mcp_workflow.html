<!doctype html>
<!-- VERSION HISTORY
v1.0.0 · 2026-09-11 · Defines MCP-first agent operation with a single-session HTTP fallback.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EP052 · Agent skill MCP workflow</title><style>
:root{--ink:#17332a;--paper:#f3f1e8;--card:#fffdf6;--line:#bcc9c0;--green:#1f754c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Segoe UI,sans-serif}header{padding:32px 5%;background:#14372c;color:white}main{display:grid;grid-template-columns:1fr 320px;gap:22px;padding:24px 5%}.lane{padding:16px;background:#e5ebe4;border-radius:14px;margin-bottom:14px}.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.node{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:130px;cursor:pointer}.node span,.node b{display:block}.status{color:var(--green);margin-top:16px;font-weight:700}aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start;position:sticky;top:20px}@media(max-width:800px){main{grid-template-columns:1fr}.nodes{grid-template-columns:1fr}aside{position:static}}</style></head><body><header><small>EP052 · REUSABLE AGENT SKILL</small><h1>MCP first. One agent identity. One active transport.</h1><p>The skill uses typed Arena MCP tools whenever available and starts the HTTP client only as an explicit fallback.</p></header><main><section id="lanes"></section><aside id="detail"><h2>Select a node</h2><p>Inspect its contract and verification.</p></aside></main><script>
const lanes=[['1 · Select transport',[['SK-110','Detect Arena MCP','Use MCP when its tools are callable.'],['SK-120','Join exactly once','Call arena_status, then arena_join only if needed.'],['SK-130','Prevent duplicate session','Never run MCP and HTTP client together.']]],['2 · Operate agent',[['SK-210','Read rules and inventory','Use MCP resources and list tools.'],['SK-220','Research and price','Query intelligence and obtain a current quote.'],['SK-230','Trade and report','Use version-bound MCP execution tools.']]],['3 · Maintain lifecycle',[['SK-310','Owner communication','Read, acknowledge and reply through MCP.'],['SK-320','Presence and movement','Maintain session and submit structured movement.'],['SK-330','Fallback / disconnect','Use HTTP only without MCP; close the chosen session.']]]];
const detail={
'SK-110':'Input: callable tool inventory. Output: MCP selected, or explicit fallback. Test: no process starts during detection.',
'SK-120':'Input: recognisable name. Action: arena_status then conditional arena_join. Test: repeated instructions retain one identity.',
'SK-130':'Invariant: one intended agent uses one transport and one session. Test: skill forbids simultaneous script and MCP operation.',
'SK-210':'Use arena:// rules resources and arena_list_strategies. The exchange remains authoritative.',
'SK-220':'Use arena_query_intelligence and arena_get_price. A successful delivery may be charged; do not retry silently.',
'SK-230':'Use arena_buy or arena_sell with current price/version, then arena_report_decision. Rejections pass back unchanged.',
'SK-310':'Use arena_read_owner_messages, arena_ack_owner_message and arena_reply_to_owner.',
'SK-320':'The MCP session maintains presence; arena_move records spatial intent for the 3D view.',
'SK-330':'Only if MCP is unavailable, run arena_agent.py. Disconnect the active transport cleanly.'};
const root=document.getElementById('lanes'),side=document.getElementById('detail');for(const [title,nodes] of lanes){const s=document.createElement('section');s.className='lane';s.innerHTML='<h2>'+title+'</h2><div class="nodes"></div>';for(const n of nodes){const b=document.createElement('div');b.className='node';b.tabIndex=0;b.innerHTML='<code>'+n[0]+'</code><b>'+n[1]+'</b><span>'+n[2]+'</span><span class="status">100% · specified</span>';b.onclick=()=>side.innerHTML='<code>'+n[0]+'</code><h2>'+n[1]+'</h2><p>'+detail[n[0]]+'</p>';s.querySelector('.nodes').append(b)}root.append(s)}
</script></body></html>
