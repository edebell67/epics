<!doctype html>
<!--
  EP047_owner_review_change_intake_workflow.html — Interactive protected owner-review intake workflow.

  VERSION HISTORY
  v1.0.0 · 2026-08-05 · Initial reviewable capability-token workflow for durable owner feedback without email transport.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EP047 Owner Review Intake Workflow</title><style>body{font:16px system-ui;margin:0;background:#f8fafc;color:#172033}main{max-width:940px;margin:auto;padding:32px}button{width:100%;text-align:left;padding:16px;margin:8px 0;border:1px solid #cbd5e1;border-radius:10px;background:white;font-weight:700}button:hover{border-color:#2563eb}#detail{background:#172033;color:white;padding:20px;border-radius:10px;margin-top:20px}.tag{font-size:12px;background:#dbeafe;color:#1d4ed8;padding:3px 7px;border-radius:99px;float:right}</style></head><body><main><h1>EP047 — owner review/change intake</h1><p>Click a step to inspect its input, authorization gate, persistence boundary, and outcome.</p><section id="steps"></section><section id="detail" aria-live="polite">Select a step.</section></main><script>const steps=[['1. Operator issues a review capability','Admin-only service creates a random capability. Only its SHA-256 hash and expiry are durable; raw token is returned once to a controlled preview-delivery path.'],['2. Owner opens /review/[token]','Public route accepts only a syntactically valid token, hashes it, and looks up an unexpired, unrevoked, unsubmitted review link. It exposes only the scoped business name and review configuration—not admin records, recipient data, or token hashes.'],['3. Owner completes structured cards','One card per configured page. Each starts with “No action required”; choosing changes reveals structured selections and free text. The first expansion stores page_open_date_time locally for that page.'],['4. One-click submit','Browser POSTs decision accept/change/decline plus per-page snapshots. Server validates enum values, bounds free text/options, locks the capability row, then persists one immutable review submission. No mailto, email provider, or delivery event is called.'],['5. Brief acknowledgement','The owner sees a concise confirmation. Replays, expired/revoked capability links, and malformed payloads get a safe error/status—not an administrative view.'],['6. Operator review boundary','Admin UI may list summaries only after requireAdminUserForPage plus role gate. It never renders raw capability material. This task does not alter Test02’s public static preview until a protected tenant/capability design wires it.']];const root=document.querySelector('#steps'),detail=document.querySelector('#detail');steps.forEach(([title,text])=>{const b=document.createElement('button');b.innerHTML=title+'<span class="tag">protected boundary</span>';b.onclick=()=>detail.textContent=text;root.append(b)});</script></body></html>
