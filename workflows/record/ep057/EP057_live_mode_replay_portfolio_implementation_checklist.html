<h1>EP057 Live Mode: implementation checklist</h1><p>Live trading stays disarmed during development and browser verification. Each status requires the evidence listed for that item.</p>
<div id="items"></div>
<script>
const checks=[
['Workflow map before implementation','Passed','Interactive workflow exists and browser interaction is verified.','~/eds/workstream/Test Results\\EP057\\20261009_152300_live_mode_workflow_interaction_passed\\workflow.png; run_report.md'],
['Portfolio-specific arm/disarm state','Passed','Only the selected LIVE or LIVE_ALT portfolio changes; UI reflects server-confirmed status.','mocked API request and response assertions'],
['Live mode enforces chart lock','Passed','Manual replay, baseline, date, scenario, filters and portfolio scope cannot change while armed.','browser control-state screenshot'],
['Chart follows incoming live data','Passed','Fresh live snapshot and server-selected strategy update the chart/head while interaction remains locked.','mocked refresh sequence and chart-head assertion'],
['Replay-derived monitoring remains visible','Partially verified','Live chart keeps overlay trades, B/X signals, P&L, trade list and target-reached marker current.','browser screenshot and calculated sample state'],
['PostgreSQL transition safety','Not run','Arm/disarm calls existing mirror path; combined_trades_open remains untouched; test order export is stubbed.','mock adapter assertions; zero actual order-file writes'],
['Failure behavior','Partially verified','Missing rules/setup or rejected transition never appears armed and existing config remains intact.','mocked 4xx/5xx/error screenshots and response report'],

document.getElementById('items').innerHTML=checks.map(([name,state,expected,evidence],i)=>'<section class="item"><strong>'+(i+1)+'. '+name+'</strong><div class="status" data-state="'+state+'">Status: '+state+'</div><div>'+expected+'</div><div class="evidence">Evidence: '+evidence+'</div></section>').join('');
</script></body></html>
