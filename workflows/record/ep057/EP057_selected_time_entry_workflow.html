<!doctype html>
<!--
 * EP057_selected_time_entry_workflow.html — Direct time selection and pinned-leader identification
 *
 * VERSION HISTORY
 * v1.0.0 · 2026-10-05 · Defines direct HH:MM selection and same-as-pin feedback before implementation.
-->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EP057 Selected-Time Entry Workflow</title><style>body{margin:28px auto;padding:0 20px;max-width:900px;background:#07111f;color:#dce8f7;font:15px system-ui}h1{color:#67e8f9}.steps{display:flex;flex-wrap:wrap;gap:10px}.step{flex:1 1 180px;text-align:left;padding:14px;background:#0d1b2c;color:#dce8f7;border:1px solid #25405a;border-radius:10px;cursor:pointer}.step[aria-selected=true]{border-color:#22d3ee}.detail{margin-top:14px;padding:18px;background:#0d1b2c;border-radius:10px;min-height:60px}</style><main><h1>#1 at Selected Time</h1><p>Choose a replay time precisely, then compare the resulting leader with pinned models.</p><div class="steps" role="tablist" aria-label="Selected-time workflow"><button class="step" role="tab" aria-selected="true" data-id="enter">1 · Enter a time</button><button class="step" role="tab" aria-selected="false" data-id="resolve">2 · Resolve snapshot</button><button class="step" role="tab" aria-selected="false" data-id="rank">3 · Find #1</button><button class="step" role="tab" aria-selected="false" data-id="compare">4 · Compare pin</button></div><section class="detail" id="detail" role="tabpanel" aria-live="polite">Enter HH:MM in the selected-time control and apply it.</section></main><script>const steps={enter:'The time field is available when #1 at Selected Time is active. Enter a time such as 18:57.',resolve:'The engine uses the latest stored five-minute snapshot at or before the requested time.',rank:'The active Net or Alt Net ranking selects the single #1 strategy for that time.',compare:'If that model ID is pinned already, the page says it is already pinned. Otherwise it appears alongside pinned models in a different color.'};document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{document.querySelectorAll('.step').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.getElementById('detail').textContent=steps[b.dataset.id]})</script></html>
