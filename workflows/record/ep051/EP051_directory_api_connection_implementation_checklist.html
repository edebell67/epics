<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>EP051 · Directory API delivery checklist</title><style>:root{--ink:#17231f;--paper:#f2eee3;--panel:#fffdf8;--line:#c9d1ca;--green:#266d50;--amber:#a87016;--muted:#65726d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}.shell{max-width:1180px;margin:auto;padding:30px}header{border-top:8px solid var(--ink);padding:24px 0}h1{font-size:clamp(34px,6vw,68px);line-height:.95;letter-spacing:-.05em;margin:8px 0}header p{color:var(--muted);max-width:800px;line-height:1.6}.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:18px 0}.metric,.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.metric b{font-size:28px}.metric span{display:block;font:10px ui-monospace;color:var(--muted);text-transform:uppercase}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button{padding:8px 10px;border:1px solid var(--line);background:white;border-radius:8px;font:700 11px ui-monospace;cursor:pointer}button.on{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item h2{font-size:17px;margin:8px 0}.item p{font-size:12px;line-height:1.5;color:var(--muted)}.id{font:10px ui-monospace;color:var(--green)}.status{display:inline-block;padding:4px 7px;border-radius:99px;font:700 9px ui-monospace}.passed{background:#d9ecd5;color:#24593d}.waiting{background:#e4e7e4;color:#58635f}.blocked{background:#f6dfd9;color:#8b392b}.evidence{border-top:1px solid var(--line);padding-top:9px}@media(max-width:750px){.grid,.top{grid-template-columns:1fr}.shell{padding:16px}}</style></head><body><div class="shell"><header><div class="id">EP051 · DELIVERY STATUS</div><h1>Directory API<br>connection checklist</h1><p>Local implementation evidence is separated from live database, browser and user acceptance. Nothing is marked passed without the named proof.</p></header><section class="top"><div class="metric"><b id="passed">6 / 10</b><span>items passed</span></div><div class="metric"><b>60%</b><span>delivery coverage</span></div><div class="metric"><b>API ready · screens pending</b><span>release state</span></div></section><nav class="controls"><button class="on" data-status="all">All</button><button data-status="Passed">Passed</button><button data-status="Not started">Not started</button><button data-status="Blocked">Blocked</button></nav><main class="grid" id="grid"></main></div><script>const items=[['CHK-01','Source schema and semantics','Passed','Read-only audit: 6,432 DNA rows; 12 direction aliases normalize to 6 canonical strategies.'],['CHK-02','Interactive workflow created','Passed','Workflow and checklist JavaScript syntax validated.'],['CHK-03','Canonical SQL aggregation','Passed','Live aggregate returned 6 canonical strategies and reconciled 6,432 trades.'],['CHK-04','FastAPI list endpoint','Passed','GET /api/dna/strategies is registered with bounded filters and approved sorting.'],['CHK-05','Endpoint contract/security tests','Passed','4/4 tests pass: allowlist, cache, DB restriction and sanitized failure.'],['CHK-06','Live SQL/API reconciliation','Passed','Isolated port 8011 response matched the source population; no restricted item keys exposed.'],['CHK-07','Directory screen wiring','Not started','Requires loading, empty, stale, retry and accessible error states.'],['CHK-08','Detail/compare/builder wiring','Not started','Requires direct-route and compatibility regression evidence.'],['CHK-09','Browser, accessibility and load','Not started','Requires Chrome/Firefox journeys and representative performance.'],['CHK-10','Release, rollback and user verification','Blocked','Blocked until screen implementation, technical evidence and user review exist.']];let filter='all';const grid=document.querySelector('#grid');function cls(s){return s==='Passed'?'passed':s==='Blocked'?'blocked':'waiting'}function render(){grid.innerHTML=items.filter(x=>filter==='all'||x[2]===filter).map(x=>`<article class="item"><span class="id">${x[0]}</span><h2>${x[1]}</h2><span class="status ${cls(x[2])}">${x[2]}</span><p class="evidence"><b>Evidence:</b> ${x[3]}</p></article>`).join('');document.querySelector('#passed').textContent=`${items.filter(x=>x[2]==='Passed').length} / ${items.length}`}document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('on',x===b));render()});render();</script></body></html>
