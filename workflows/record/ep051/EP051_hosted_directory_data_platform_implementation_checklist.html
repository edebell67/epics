<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>EP051 · Hosted platform checklist</title><style>:root{--ink:#14201c;--paper:#eee9dc;--panel:#fffdf8;--line:#c6cec7;--green:#286d50;--muted:#65716c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}.shell{max-width:1200px;margin:auto;padding:30px}header{border-top:8px solid var(--ink);padding:24px 0}h1{font-size:clamp(36px,6vw,70px);line-height:.92;letter-spacing:-.055em;margin:8px 0}header p{max-width:850px;color:var(--muted);line-height:1.6}.metrics,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric,.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.metric b{font-size:28px}.metric span{display:block;font:9px ui-monospace;text-transform:uppercase;color:var(--muted)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}button{border:1px solid var(--line);background:white;padding:8px 10px;border-radius:8px;font:700 10px ui-monospace;cursor:pointer}button.on{background:var(--ink);color:white}.id{font:10px ui-monospace;color:var(--green)}.item h2{font-size:16px;margin:8px 0}.item p{font-size:11px;line-height:1.5;color:var(--muted)}.state{display:inline-block;padding:4px 7px;border-radius:99px;font:700 9px ui-monospace}.passed{background:#d8ecd2;color:#24593e}.waiting{background:#e4e7e4;color:#59635f}.blocked{background:#f3ddd7;color:#8c3d30}@media(max-width:800px){.grid,.metrics{grid-template-columns:1fr}.shell{padding:16px}}</style></head><body><div class="shell"><header><div class="id">EP051 · HOSTED DELIVERY STATUS</div><h1>Portable by design.<br>Evidence before release.</h1><p>The online database, API and screens are separate deployable units joined by versioned contracts. Local source access is never required by the public runtime.</p></header><section class="metrics"><div class="metric"><b id="count">9 / 12</b><span>passed</span></div><div class="metric"><b>82%</b><span>coverage</span></div><div class="metric"><b>Hosted verification</b><span>current gate</span></div></section><nav class="filters"><button class="on" data-filter="all">All</button><button data-filter="Passed">Passed</button><button data-filter="In progress">In progress</button><button data-filter="Blocked">Blocked</button></nav><main class="grid" id="grid"></main></div><script>const items=[['HP-01','Hosted architecture workflow','Passed','Actor flow, contracts, failure modes and evidence gates are documented.'],['HP-02','Stable public API contract','Passed','Existing `/api/dna/strategies` contract and 6,432-trade reconciliation provide the baseline.'],['HP-03','Sanitized snapshot exporter','Passed','Requires deterministic envelope/hash/redaction tests.'],['HP-04','Outbound sync agent','Passed','Requires HTTPS, idempotency and retry tests.'],['HP-05','Authenticated ingestion route','Passed','Requires body bounds, token, schema/hash/watermark validation.'],['HP-06','Hosted PostgreSQL migration','Passed','Requires clean apply, constraints and rollback evidence.'],['HP-07','Atomic snapshot repository','Passed','Requires transaction/fault and previous-version rollback tests.'],['HP-08','Containerized hosted API','Passed','Requires DATABASE_URL-only boot, health and contract tests.'],['HP-09','Environment-neutral web client','Passed','Requires no hard-coded localhost and local/preview parity.'],['HP-10','All screen adapters','In progress','Requires directory/detail/compare/builder browser reconciliation.'],['HP-11','Security/load/observability','In progress','Requires explicit CORS, rate/bounds, freshness alerts and load report.'],['HP-12','Hosted deploy/restore/rollback/user verification','Blocked','Needs provider, database, credentials, deployment authorization and user acceptance.']];let filter='all';const cls=s=>s==='Passed'?'passed':s==='Blocked'?'blocked':'waiting';function render(){document.querySelector('#grid').innerHTML=items.filter(x=>filter==='all'||x[2]===filter).map(x=>`<article class="item"><span class="id">${x[0]}</span><h2>${x[1]}</h2><span class="state ${cls(x[2])}">${x[2]}</span><p>${x[3]}</p></article>`).join('');document.querySelector('#count').textContent=`${items.filter(x=>x[2]==='Passed').length} / ${items.length}`}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});render();</script></body></html>
