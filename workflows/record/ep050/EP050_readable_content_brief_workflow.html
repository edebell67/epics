<h1>Readable production package</h1><p>Select a step to inspect its contract.</p><main id="steps"></main><section class="detail" id="detail">Choose a step.</section>
<script>const steps=[['Open package','Load the latest campaign-bound Node 17/18 output.'],['Read brief','Present title, format, audience, draft, CTA, notice and verified sources in plain language.'],['Video detail','When the package is video, show narration, on-screen text and scenes in order.'],['Reuse','Copy the complete brief or download it as a Markdown file.'],['Boundary','Do not render, upload or publish from these controls.']];document.querySelector('#steps').innerHTML=steps.map((s,i)=>`<button onclick="show(${i})"><b>${i+1}. ${s[0]}</b><br>${s[1]}</button>`).join('');function show(i){document.querySelector('#detail').textContent=steps[i][0]+' — '+steps[i][1]}</script>
