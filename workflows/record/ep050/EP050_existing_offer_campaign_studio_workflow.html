<!doctype html>
<!-- workstream/600_workflow/ep050/EP050_existing_offer_campaign_studio_workflow.html — Existing-offer matrix workflow.
VERSION HISTORY
v1.0.0 · 2026-08-21 · Defines the pre-code product × location × audience campaign-generation workflow.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EP050 Existing Offer Studio Workflow</title><style>:root{--ink:#14201a;--paper:#f5f7f3;--line:#d3dfd6;--green:#087443}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:28px}header{background:#10271c;color:white;max-width:none;padding-left:max(28px,calc((100vw - 1144px)/2))}h1{font:700 34px Georgia,serif;margin:0}.lane{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin:18px 0}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.node{border:1px solid var(--line);background:white;border-radius:10px;padding:14px;text-align:left;cursor:pointer}.node b,.node small{display:block}.node small{color:var(--green);font:10px ui-monospace,monospace}.node span{font-size:12px;color:#66736b}.detail{border-left:4px solid var(--green);padding:14px;background:#eaf4ee}@media(max-width:800px){.flow{grid-template-columns:1fr}.node{min-height:44px}}</style></head><body><header><h1>Existing Offer → Campaign Matrix</h1><p>Define shared facts once, generate governed campaign variants, then enter the existing EP050 demand engine.</p></header><main><section class="lane"><div class="flow" id="flow"></div></section><section class="detail"><h2 id="title">Select a node</h2><p id="copy"></p><p><b>Completion test:</b> <span id="test"></span></p></section></main><script>const nodes=[['01','Define shared offer','Product intelligence and conversion objective entered once.','Required facts pass Nodes 02 and 04 validation.'],['02','Build dimensions','Add one or more products/services, known geographic scopes and audiences.','Every dimension contains at least one non-empty value.'],['03','Preview matrix','Show every product × location × audience combination and total count.','Preview count equals the Cartesian product.'],['04','Create campaigns','Send all rows through the existing bulk-import endpoint.','Each valid row creates its own persistent run; failures are reported independently.'],['05','Operate portfolio','Created runs appear in Market Radar and can be driven continuously.','Campaign Queue displays every created run and real position.']];const flow=document.querySelector('#flow');nodes.forEach(([id,name,copy,test])=>{const b=document.createElement('button');b.className='node';b.innerHTML=`<small>${id} · 100% designed</small><b>${name}</b><span>${copy}</span>`;b.onclick=()=>{title.textContent=name;window.copy.textContent=copy;window.test.textContent=test};flow.append(b)});flow.firstChild.click();</script></body></html>
