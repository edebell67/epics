<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EP050 Selectable Batch Workflow</title><style>body{font:16px system-ui;margin:32px;background:#f4f1e8;color:#102d21}main{max-width:980px;margin:auto}h1{font:38px Georgia,serif}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.step{padding:18px;background:#fff;border:1px solid #cbc7ba;border-radius:10px}.step b{display:block;color:#07864b;margin-bottom:8px}.note{margin-top:20px;padding:16px;background:#102d21;color:white;border-radius:10px}@media(max-width:760px){.flow{grid-template-columns:1fr}}</style></head><body><main><h1>Selected campaigns to content packages</h1><div class="flow"><div class="step"><b>1</b>Select saved campaigns</div><div class="step"><b>2</b>Submit one batch</div><div class="step"><b>3</b>Run up to three concurrently</div><div class="step"><b>4</b>Show PASS or explicit FAIL per campaign</div><div class="step"><b>5</b>Open each successful content package</div></div><div class="note">Queued and running jobs are durable. The Automatic runs page remains the live status view for the batch.</div></main></body></html>
