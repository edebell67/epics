<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub + Render Deployment Skills — Workflow</title><style>:root{--bg:#0b1220;--panel:#121d31;--line:#2a3956;--ink:#eaf1ff;--muted:#a9b8d4;--good:#34d399;--warn:#fbbf24;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#09111f,#121b30);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:32px 20px}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.5rem)}.lead{color:var(--muted);max-width:800px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.filters button,.step{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer}.filters button{padding:8px 12px}.filters button.active{background:var(--accent);color:#07101f}.flow{display:grid;gap:12px}.step{text-align:left;padding:18px;transition:.15s}.step:hover,.step.selected{border-color:var(--accent);transform:translateY(-1px)}.meta{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:.85rem}.tag{padding:2px 7px;border-radius:999px;background:#213252;color:#bcd5ff}.detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted)}.selected .detail{display:block}.gate{color:var(--good);font-weight:700}.blocked{color:var(--warn);font-weight:700}code{color:#b9d5ff}footer{color:var(--muted);margin-top:25px;font-size:.9rem}</style></head><body><main><h1>GitHub + Render deployment skills</h1><p class="lead">Interactive release workflow for the two reusable skills added to <code>skills/</code>. Select a lane, then click any step to reveal its required evidence and stop condition.</p><div class="filters" aria-label="Workflow filters"><button class="active" data-filter="all">All steps</button><button data-filter="github">GitHub / Pages</button><button data-filter="render">Render</button><button data-filter="shared">Shared gates</button></div><section class="flow" id="flow"><button class="step" data-lane="shared"><div class="meta"><span class="tag">Shared gate</span><span>1 · Scope and provenance</span></div><strong>Identify the exact project, deployable path, branch, local commit, release intent and forbidden side effects.</strong><div class="detail"><span class="gate">Pass:</span> source path and intended host are recorded. <span class="blocked">Stop:</span> no public posting, DNS, data import, external send or merge without explicit approval.</div></button><button class="step" data-lane="github"><div class="meta"><span class="tag">GitHub</span><span>2 · Validate static suitability</span></div><strong>Classify static output versus dynamic services; retain static libraries on GitHub Pages.</strong><div class="detail"><span class="gate">Pass:</span> local production artifact is inspected, base paths are correct, and no secrets/server code are public. Dynamic API/admin/database requirements route to Render.</div></button><button class="step" data-lane="github"><div class="meta"><span class="tag">GitHub</span><span>3 · Build, scope and push</span></div><strong>Run the production build, stage only the scoped files, inspect the staged diff, and push the verified commit.</strong><div class="detail"><span class="gate">Pass:</span> local SHA equals remote branch SHA. GitHub Pages workflow (when used) is associated with that exact SHA—not an older green run.</div></button><button class="step" data-lane="github"><div class="meta"><span class="tag">GitHub</span><span>4 · Verify Pages live behavior</span></div><strong>Check the Pages deployment, live document, key asset, navigation and browser console.</strong><div class="detail"><span class="gate">Pass:</span> deploy succeeds; live URL and asset return success; desktop/mobile rendering and an interaction are demonstrated. A push alone is not completion.</div></button><button class="step" data-lane="render"><div class="meta"><span class="tag">Render</span><span>5 · Derive service configuration</span></div><strong>Read the actual application manifests to establish runtime, root directory, build/start commands, port, health route, environment and data contract.</strong><div class="detail"><span class="gate">Pass:</span> no values are guessed. Choose a Blueprint for repeatable/multi-service deployments; use a simple Git service only when that model fits.</div></button><button class="step" data-lane="render"><div class="meta"><span class="tag">Render</span><span>6 · Release safety gate</span></div><strong>Set secrets outside Git, validate migrations/rollback, access controls, health behavior and Git remote SHA.</strong><div class="detail"><span class="gate">Pass:</span> service can build and start securely from the pushed revision; database and admin access gates are defined. <span class="blocked">Stop:</span> never expose an unauthenticated admin page or run destructive production operations speculatively.</div></button><button class="step" data-lane="render"><div class="meta"><span class="tag">Render</span><span>7 · Deploy and monitor exact SHA</span></div><strong>Trigger/approve Render deployment and inspect the build/start/health logs for the intended commit.</strong><div class="detail"><span class="gate">Pass:</span> service status is <code>live</code> and reported deployment SHA matches remote intended SHA. Diagnose logs before changing code; fix one established cause per retry.</div></button><button class="step" data-lane="shared"><div class="meta"><span class="tag">Shared gate</span><span>8 · Prove and hand off</span></div><strong>Test health, public, protected and core routes; capture deployment provenance and a rollback target.</strong><div class="detail"><span class="gate">Pass:</span> live behavior—not dashboard colour—is verified. Custom domains map hosts, not paths; no Namecheap DNS change without explicit approval and rollback values.</div></button></section><footer>Delivery state: <b>implemented</b> · click steps to review the control points.</footer></main><script>const buttons=[...document.querySelectorAll('.step')],filters=[...document.querySelectorAll('.filters button')];buttons.forEach(b=>b.onclick=()=>b.classList.toggle('selected'));filters.forEach(f=>f.onclick=()=>{filters.forEach(x=>x.classList.remove('active'));f.classList.add('active');let lane=f.dataset.filter;buttons.forEach(b=>b.hidden=lane!=='all'&&b.dataset.lane!==lane)});</script></body></html>
